######### OPTIONS / KEYBINDS ##########
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Rebind splits
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
unbind c
bind c new-window -c "#{pane_current_path}"

# Source tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set environment variable for TPM
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# Pane sizing up and down
bind -r d resize-pane -D 5
bind -r u resize-pane -U 5

# Make current pane full screen
bind -r m resize-pane -Z

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Set vi-mode
set-window-option -g mode-keys vi

# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
 
######### PLUGINS ##########

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-logging'

# Theme configuration (now uses powerkit)
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'

# Right
set -g @rose_pine_host 'off' # Enables hostname in the status bar
set -g @rose_pine_date_time '%A, %B %d - %-I:%M%P' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_user 'off' # Turn on the username component in the statusbar
set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar
set -g @rose_pine_bar_bg_disable 'on' # Disables background color, for transparent terminal emulators
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_status_right_prepend_section ''
set -g @rose_pine_status_right_append_section ''

# Left
set -g @rose_pine_only_windows 'off' # Leaves only the window module, for max focus and space
set -g @rose_pine_disable_active_window_menu 'on' # Disables the menu that shows the active window on the left
set -g @rose_pine_default_window_behavior 'off' # Forces tmux default window list behaviour
set -g @rose_pine_show_current_program 'on' # Forces tmux to show the current running program as window name
set -g @rose_pine_show_pane_directory 'off' # Forces tmux to show the current directory as window name
set -g @rose_pine_status_left_prepend_section ' '
set -g @rose_pine_status_left_append_section ' '
set -g @rose_pine_window_status_separator "  " # Changes the default icon that appears between window names

set -g @rose_pine_left_separator '' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' - ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator '' # Again, 1-space padding, it updates with prefix + I
set -g @rose_pine_window_separator ') ' # Replaces the default `:` between the window number and name
set -g @rose_pine_session_icon '󰚯' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname

# Start TPM
run '~/.tmux/plugins/tpm/tpm'

# Use $TERM BG
set -g status-bg default
set -g status-style bg=default

# ENABLE IF BOTTOM BAR
# Create a gap above the status bar (only if not already 2 lines)
if -F '#{!=:#{status},2}' {
    # Copy the existing single-line format to the *second* line
    set -Fg 'status-format[1]' '#{status-format[0]}'
    # Make the *top* line of the status area blank (this becomes the gap)
    set -g 'status-format[0]' ''
    # Turn on two-line status
    set -g status 2
}

